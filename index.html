<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客 | 欢迎</title>
    <style>
        :root {
            --bg: #fafafa;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #e91e63;
            --card-bg: #ffffff;
            --radius: 12px;
            --max-width: 720px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --text: #e5e7eb;
                --muted: #94a3b8;
                --card-bg: #1e293b;
                --primary: #f472b6;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 17px;
            line-height: 1.75;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        header {
            padding: 30px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(128, 128, 128, 0.15);
        }
        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text);
            text-decoration: none;
        }
        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--primary); }
        main {
            flex: 1;
            padding: 60px 0;
        }
        .welcome-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(128, 128, 128, 0.1);
            text-align: center;
        }
        .welcome-card h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .welcome-card p {
            color: var(--muted);
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .post-list {
            margin-top: 40px;
            display: grid;
            gap: 20px;
        }
        .post-item {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid rgba(128, 128, 128, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .post-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .post-item h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .post-item .meta {
            font-size: 0.85rem;
            color: var(--muted);
        }
        footer {
            padding: 30px 0;
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted);
            border-top: 1px solid rgba(128, 128, 128, 0.15);
        }
        @media (max-width: 600px) {
            .welcome-card { padding: 25px; }
            .welcome-card h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <header class="container">
        <a href=" " class="logo">🌟 我的博客</a >
        <nav class="nav-links">
            <a href="/">首页</a >
            <a href="/archives">归档</a >
            <a href="/about">关于</a >
        </nav>
    </header>
    <main class="container">
        <div class="welcome-card">
            <h1>你好，世界！</h1>
            <p>欢迎来到我的 GitHub 博客主页。这里将记录我的学习、生活和思考。</p >
            <a href="/archives" class="btn">开始阅读</a >
        </div>
        <div class="post-list">
            <a href="#" class="post-item">
                <h3>我的第一篇文章</h3>
                <div class="meta">2026-09-22 · 生活随笔</div>
            </a >
            <a href="#" class="post-item">
                <h3>折腾 GitHub Pages 的记录</h3>
                <div class="meta">2026-09-20 · 技术折腾</div>
            </a >
        </div>
    </main>
    <footer>
        <p>&copy; 2026 我的博客. Powered by GitHub Pages.</p >
    </footer>
</body>
</html>
